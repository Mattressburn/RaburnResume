[build]
  # "npm run build" now runs "vite build" because we updated package.json
  command = "npm run build" 
  
  # This must match the "outDir" we set in vite.config.js
  publish = "build" 
  
  # Where your server-side functions live
  functions = "netlify/functions"

[build.environment]
  # Vite 7 needs Node 20.19+ or 22.12+; the site's default Node is older
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[dev]
  # vite.config.js pins the dev server to 3001
  targetPort = 3001

[[redirects]]
  # This is needed for React Router to work on refresh
  from = "/*"
  to = "/index.html"
  status = 200